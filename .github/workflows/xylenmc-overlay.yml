name: XylenMC Android Overlay APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xylenmc-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build XylenMC APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Extract XylenMC project archive
        shell: bash
        run: |
          set -euo pipefail

          test -f XylenMC_Native_Overlay_Source.zip

          mkdir -p "$RUNNER_TEMP/xylenmc-project"

          unzip -q XylenMC_Native_Overlay_Source.zip \
            -d "$RUNNER_TEMP/xylenmc-project"

          SETTINGS_FILE=$(find "$RUNNER_TEMP/xylenmc-project" \
            -name settings.gradle.kts -type f -print -quit)

          test -n "$SETTINGS_FILE"

          PROJECT_ROOT=$(dirname "$SETTINGS_FILE")

          test -f "$PROJECT_ROOT/app/build.gradle.kts"

          echo "XYLEN_PROJECT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo "Project found at: $PROJECT_ROOT"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$XYLEN_PROJECT"

          gradle --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            :app:assembleDebug

      - name: Find generated APK
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find "$XYLEN_PROJECT/app/build/outputs/apk" \
            -type f -name '*.apk' -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK file was not generated."
            exit 1
          fi

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

          echo "APK successfully found: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: XylenMC-debug-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14
